services:

  testapp:
    build: .
    image: krunalhande/testap:latest
    container_name: testapp1
    restart: unless-stopped

    ports:
      - "5050:5050"

    environment:
      MONGO_URL: mongodb://admin:qwerty@mongo:27017

    depends_on:
      - mongo

    networks:
      - test-network


  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty

    volumes:
      - mongo-data:/data/db

    networks:
      - test-network


  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped

    depends_on:
      - mongo

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwerty@mongo:27017/

    ports:
      - "8081:8081"

    networks:
      - test-network


networks:
  test-network:
    driver: bridge


volumes:
  mongo-data:
